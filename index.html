<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #343541;
            color: #ececf1;
            height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #202123;
            border-bottom: 1px solid #4d4d4f;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .settings-btn {
            background: none;
            border: none;
            color: #ececf1;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .settings-btn:hover {
            background-color: #4d4d4f;
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .message.user {
            background-color: #343541;
        }

        .message.assistant {
            background-color: #444654;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: #5436da;
        }

        .message.assistant .message-avatar {
            background-color: #19c37d;
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .input-container {
            padding: 20px;
            background-color: #343541;
            border-top: 1px solid #4d4d4f;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background-color: #40414f;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #565869;
        }

        .input-wrapper:focus-within {
            border-color: #8e8ea0;
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: #ececf1;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
            max-height: 200px;
        }

        .message-input::placeholder {
            color: #8e8ea0;
        }

        .send-btn {
            background-color: #19c37d;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #1a9d6c;
        }

        .send-btn:disabled {
            background-color: #565869;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background-color: #202123;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #4d4d4f;
        }

        .modal h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c5c5d2;
        }

        .modal-field input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #4d4d4f;
            background-color: #40414f;
            color: #ececf1;
            font-size: 14px;
        }

        .modal-field input:focus {
            outline: none;
            border-color: #8e8ea0;
        }

        .modal-field small {
            display: block;
            margin-top: 8px;
            color: #8e8ea0;
            font-size: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel {
            background-color: #40414f;
            color: #ececf1;
        }

        .modal-btn.save {
            background-color: #19c37d;
            color: white;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #8e8ea0;
        }

        .welcome-message h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #ececf1;
        }

        .welcome-message p {
            margin-bottom: 8px;
        }

        .error-message {
            background-color: #ef4444;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 20px;
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background-color: #8e8ea0;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function GearIcon() {
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            );
        }

        function SettingsModal({ isOpen, onClose, apiKey, onSave }) {
            const [tempApiKey, setTempApiKey] = useState(apiKey);

            useEffect(() => {
                setTempApiKey(apiKey);
            }, [apiKey, isOpen]);

            if (!isOpen) return null;

            const handleSave = () => {
                onSave(tempApiKey);
                onClose();
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <h2>Settings</h2>
                        <div className="modal-field">
                            <label htmlFor="apiKey">OpenAI API Key</label>
                            <input
                                type="password"
                                id="apiKey"
                                value={tempApiKey}
                                onChange={e => setTempApiKey(e.target.value)}
                                placeholder="sk-..."
                            />
                            <small>
                                APIキーはブラウザのセッションストレージに保存され、タブを閉じると削除されます。
                                サーバーには送信されません。
                            </small>
                        </div>
                        <div className="modal-buttons">
                            <button className="modal-btn cancel" onClick={onClose}>
                                Cancel
                            </button>
                            <button className="modal-btn save" onClick={handleSave}>
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function Message({ role, content }) {
            return (
                <div className={`message ${role}`}>
                    <div className="message-avatar">
                        {role === 'user' ? 'You' : 'AI'}
                    </div>
                    <div className="message-content">{content}</div>
                </div>
            );
        }

        function LoadingMessage() {
            return (
                <div className="message assistant">
                    <div className="message-avatar">AI</div>
                    <div className="message-content">
                        <div className="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [apiKey, setApiKey] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const chatContainerRef = useRef(null);
            const textareaRef = useRef(null);

            useEffect(() => {
                const savedKey = sessionStorage.getItem('openai_api_key');
                if (savedKey) {
                    setApiKey(savedKey);
                }
            }, []);

            useEffect(() => {
                if (chatContainerRef.current) {
                    chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
                }
            }, [messages, isLoading]);

            const handleSaveApiKey = (key) => {
                setApiKey(key);
                if (key) {
                    sessionStorage.setItem('openai_api_key', key);
                } else {
                    sessionStorage.removeItem('openai_api_key');
                }
            };

            const sendMessage = async () => {
                if (!input.trim() || isLoading) return;

                if (!apiKey) {
                    setError('APIキーを設定してください。右上の歯車アイコンをクリックして設定できます。');
                    return;
                }

                setError('');
                const userMessage = { role: 'user', content: input.trim() };
                const newMessages = [...messages, userMessage];
                setMessages(newMessages);
                setInput('');
                setIsLoading(true);

                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: newMessages.map(m => ({ role: m.role, content: m.content })),
                            max_tokens: 2048
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        if (response.status === 401) {
                            throw new Error('APIキーが無効です。設定を確認してください。');
                        } else if (response.status === 429) {
                            throw new Error('APIの利用制限に達しました。しばらく待ってから再試行してください。');
                        } else {
                            throw new Error(errorData.error?.message || 'APIリクエストに失敗しました。');
                        }
                    }

                    const data = await response.json();
                    const assistantMessage = {
                        role: 'assistant',
                        content: data.choices[0].message.content
                    };
                    setMessages([...newMessages, assistantMessage]);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const handleInputChange = (e) => {
                setInput(e.target.value);
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 200) + 'px';
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <h1>ChatGPT Demo</h1>
                        <button className="settings-btn" onClick={() => setIsSettingsOpen(true)} title="Settings">
                            <GearIcon />
                        </button>
                    </header>

                    <div className="chat-container" ref={chatContainerRef}>
                        {messages.length === 0 ? (
                            <div className="welcome-message">
                                <h2>ChatGPT Demo</h2>
                                <p>ChatGPTとチャットを始めましょう。</p>
                                <p>まず右上の歯車アイコンからAPIキーを設定してください。</p>
                            </div>
                        ) : (
                            messages.map((msg, index) => (
                                <Message key={index} role={msg.role} content={msg.content} />
                            ))
                        )}
                        {isLoading && <LoadingMessage />}
                    </div>

                    {error && <div className="error-message">{error}</div>}

                    <div className="input-container">
                        <div className="input-wrapper">
                            <textarea
                                ref={textareaRef}
                                className="message-input"
                                value={input}
                                onChange={handleInputChange}
                                onKeyDown={handleKeyDown}
                                placeholder="メッセージを入力..."
                                rows="1"
                            />
                            <button
                                className="send-btn"
                                onClick={sendMessage}
                                disabled={!input.trim() || isLoading}
                            >
                                Send
                            </button>
                        </div>
                    </div>

                    <SettingsModal
                        isOpen={isSettingsOpen}
                        onClose={() => setIsSettingsOpen(false)}
                        apiKey={apiKey}
                        onSave={handleSaveApiKey}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
